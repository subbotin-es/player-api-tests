name: .NET

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  checks: write
  pages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with TRX report
        run: |
          dotnet test PlayerApi.Tests/PlayerApi.Tests.csproj --no-build --configuration Release \
            --logger "trx;LogFileName=results.trx"

      - name: Generate GitHub Actions summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: NUnit Results
          path: '**/TestResults/results.trx'
          reporter: dotnet-trx

      - name: Generate HTML report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.10
          reportgenerator "-reports:PlayerApi.Tests/TestResults/results.trx" \
            "-targetdir:PlayerApi.Tests/TestResults/report" \
            "-reporttypes:HtmlInline_AzurePipelines"

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./PlayerApi.Tests/TestResults/report
          destination_dir: test-report
          publish_branch: gh-pages
          allow_empty_commit: true